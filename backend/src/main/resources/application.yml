spring:
  application:
    name: chatapp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${SPRING_DATASOURCE_USERNAME:chatapp}
    password: ${SPRING_DATASOURCE_PASSWORD:chatapp}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-32bytes-min}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:chatapp}
    secret-key: ${S3_SECRET_KEY:chatapp123}
    bucket: ${S3_BUCKET:chatapp-uploads}
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/chatapp-uploads}

  presence:
    heartbeat-ttl-seconds: 60

  anonymous:
    session-ttl-hours: 24
    match-queue-poll-ms: 400

  rate-limit:
    messages-per-minute: 60
    auth-attempts-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.chatapp: INFO
    org.springframework.web.socket: INFO
